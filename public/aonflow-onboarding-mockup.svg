    <text x="272" y="44" fill="#A9B8C8" font-family="Inter, Arial, sans-serif" font-size="19">Marketing intent -> registration -> session persistence -> workspace access</text>
  </g>

  <defs>
    <radialGradient id="authGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1130 730) rotate(90) scale(390)">
      <stop stop-color="#2EEBFF"/>
      <stop offset="1" stop-color="#2EEBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rscGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(332 250) rotate(90) scale(300)">
      <stop stop-color="#2A6CFF"/>
      <stop offset="1" stop-color="#2A6CFF" stop-opacity="0"/>
    </radialGradient>
