    <text x="352" y="256" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Source</text>
    <path d="M474 249H540" stroke="#56DBF7" stroke-width="4" stroke-linecap="round"/>
