    <rect x="540" y="214" width="154" height="70" rx="18" fill="#0D1B2D" stroke="#31506A"/>
    <text x="576" y="256" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Map</text>
    <path d="M617 284V334" stroke="#56DBF7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="617" cy="334" r="6" fill="#56DBF7"/>
    <rect x="540" y="334" width="154" height="58" rx="18" fill="#0D1B2D" stroke="#31506A"/>
    <text x="578" y="369" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Run</text>
    <rect x="320" y="334" width="154" height="58" rx="18" fill="#0D1B2D" stroke="#31506A"/>
    <text x="350" y="369" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Preview</text>
    <path d="M540 363H474" stroke="#56DBF7" stroke-width="4" stroke-linecap="round"/>
