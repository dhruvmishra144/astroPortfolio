<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" rx="44" fill="#06101D"/>
  <rect x="1" y="1" width="1598" height="998" rx="43" stroke="#274155" stroke-width="2"/>
  <circle cx="1130" cy="730" r="390" fill="url(#authGlow)" opacity="0.38"/>
  <circle cx="332" cy="250" r="300" fill="url(#rscGlow)" opacity="0.28"/>

  <text x="112" y="138" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" letter-spacing="8">AUTHENTICATED DEMO HANDOFF</text>
