    <text x="66" y="75" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Firestore-backed workspace entry</text>
    <rect x="34" y="134" width="210" height="286" rx="24" fill="#07111E" stroke="#243B52"/>
    <text x="64" y="178" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850">PROFILE STATE</text>
    <text x="64" y="224" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">uid</text>
    <text x="64" y="264" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">workspaceId</text>
    <text x="64" y="304" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">onboardingStep</text>
    <text x="64" y="344" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">demoAccess</text>

