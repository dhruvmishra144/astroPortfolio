  <text x="116" y="256" fill="#A9B8C8" font-family="Inter, Arial, sans-serif" font-size="22">Firebase Auth and Firestore state keep the registration path lightweight, persistent, and secure.</text>

  <g transform="translate(112 338)">
    <rect width="520" height="474" rx="34" fill="#0A1524" stroke="#243B52"/>
    <rect x="34" y="34" width="452" height="64" rx="20" fill="#0F2236"/>
    <text x="66" y="74" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Developer registration</text>
    <rect x="34" y="132" width="452" height="64" rx="18" fill="#07111E" stroke="#243B52"/>
    <text x="64" y="172" fill="#8EA4BA" font-family="Inter, Arial, sans-serif" font-size="17">work-email@company.com</text>
    <rect x="34" y="216" width="452" height="64" rx="18" fill="#07111E" stroke="#243B52"/>
    <text x="64" y="256" fill="#8EA4BA" font-family="Inter, Arial, sans-serif" font-size="17">Company workspace slug</text>
    <rect x="34" y="306" width="452" height="62" rx="31" fill="#56DBF7"/>
    <text x="178" y="346" fill="#06101D" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">Create secure demo</text>
    <rect x="34" y="398" width="452" height="42" rx="21" fill="#0F1D2E"/>
    <circle cx="62" cy="419" r="7" fill="#70F6BD"/>
    <text x="84" y="426" fill="#A9B8C8" font-family="Inter, Arial, sans-serif" font-size="16">Auth state isolated from static marketing UI</text>
  </g>

